<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>30DaysOfJavaScript: Day 11</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="main-heading">30 Days Of JavaScript LeaderBoard Challenge</h1>

  <div class="form-container">
    <input type="text" class="input-field" id="input-first-name" placeholder="First Name" />
    <input type="text" class="input-field" id="input-last-name" placeholder="Last Name" />
    <input type="text" class="input-field" id="input-country" placeholder="Country" />
    <input type="number" class="input-field" id="input-points" placeholder="Points" />
    <button id="btn-add-player">Add Player</button>
  </div>

  <div id="error-message"></div>
  <div id="player-list"></div>

  <script src="script.js"></script>
</body>
</html>
